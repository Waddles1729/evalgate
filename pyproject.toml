[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalgate"
version = "0.1.0"
description = "A regression gate for LLM applications: score against a golden dataset, diff against a committed baseline, fail the build when it gets worse."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Masanari Makino", email = "masanari773@gmail.com" }]
keywords = ["llm", "evaluation", "llmops", "rag", "ci", "regression-testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
# PyYAML only. Provider calls go through urllib so that adding evalgate to a
# project does not drag two vendor SDKs into its dependency tree.
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
evalgate = "evalgate.cli:main"

[project.urls]
Homepage = "https://github.com/Waddles1729/evalgate"
Issues = "https://github.com/Waddles1729/evalgate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
